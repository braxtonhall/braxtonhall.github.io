<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="/img/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="theme-color" content="#000000" />
		<meta name="description" content="a website by braxton hall" />
		<link rel="apple-touch-icon" href="/img/icon128.png" />

		<title>Star Trek Watch History</title>
		<script src="https://d3js.org/d3.v7.min.js"></script>
		<script src="https://unpkg.com/cal-heatmap/dist/cal-heatmap.min.js"></script>
		<script src="https://unpkg.com/@popperjs/core@2"></script>
		<script src="https://unpkg.com/cal-heatmap/dist/plugins/Tooltip.min.js"></script>
		<script src="https://unpkg.com/cal-heatmap/dist/plugins/CalendarLabel.min.js"></script>
		<link rel="stylesheet" href="https://unpkg.com/cal-heatmap/dist/cal-heatmap.css" />
		<style>
			body {
				margin: 50px auto;
				max-width: 1000px;
				position: relative;
				text-shadow: 0 0 0.1px rgba(0, 0, 0, 0.5);
				text-rendering: optimizeLegibility;
				font: 0.9em/1.3em Georgia, serif;
				-webkit-font-smoothing: subpixel-antialiased;
				-moz-osx-font-smoothing: grayscale;
			}

			a,
			a:visited,
			a:hover {
				color: blue;
				text-shadow: 0 0 0.1px rgba(255, 0, 0, 0.5);
			}

			blockquote {
				margin-inline-start: 5px;
				margin-inline-end: 5px;
				color: gray;
			}

			main {
				max-width: 500px;
				margin: 25px 20px 0;
			}

			h1,
			h2,
			h3,
			li,
			summary,
			p {
				font-weight: normal;
				font-size: 13px;
			}

			summary {
				font-style: italic;
			}

			div.contains-oversized {
				padding: 25px;
				box-sizing: border-box;
				width: 100%;
				overflow: scroll;
				> * {
					width: fit-content;
				}
			}

			header,
			footer {
				text-align: right;
				margin: 0;
				margin-right: 20px;
			}

			ul {
				padding-inline-start: 12px;
			}

			ol {
				padding-inline-start: 12px;
			}

			header li {
				list-style: none;
			}

			@media only screen and (min-width: 600px) {
				header,
				footer {
					position: absolute;
					right: 0;
				}

				header {
					top: 0;
				}

				footer {
					bottom: 0;
				}

				main {
					margin-top: 0;
					margin-right: 200px;
				}
			}
			header > * {
				margin: 0;
			}
			main > h1:after {
				content: " ";
				display: block;
				border: 0.1px solid lightgray;
			}
			img {
				margin-bottom: 2em;
				max-width: 100%;
				display: block;
				margin-left: auto;
				margin-right: auto;
			}
			label {
				input {
					display: none;
				}
				&:has(input:not(:checked)) {
					cursor: pointer;
					color: blue;
					text-decoration: underline;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<h1>star trek</h1>
			<p>
				i really like star trek. i started <a href="https://st.braxtonhall.ca">keeping track</a> right after i
				finished tos, which would have added some green to 2022 and the first bit of 2023.
			</p>
			<label title="Star Trek">
				<input id="all" type="radio" name="show" checked />
				<span>all</span>
			</label>
			<label title="Star Trek: The Original Series">
				<input id="tos" type="radio" name="show" />
				<span>tos</span>
			</label>
			<label title="Star Trek: The Animated Series">
				<input id="tas" type="radio" name="show" />
				<span>tas</span>
			</label>
			<label title="Star Trek Movies">
				<input id="mov" type="radio" name="show" />
				<span>movies</span>
			</label>
			<label title="Star Trek: The Next Generation">
				<input id="tng" type="radio" name="show" />
				<span>tng</span>
			</label>
			<label title="Star Trek: Deep Space Nine">
				<input id="ds9" type="radio" name="show" />
				<span>ds9</span>
			</label>
			<label title="Star Trek: Voyager">
				<input id="voy" type="radio" name="show" />
				<span>voy</span>
			</label>
			<label title="Star Trek: Enterprise">
				<input id="ent" type="radio" name="show" />
				<span>ent</span>
			</label>
			<label title="Star Trek: Fables and Folklore">
				<input id="ff" type="radio" name="show" />
				<span>ff</span>
			</label>
		</main>
		<div class="contains-oversized">
			<div id="calendars"></div>
		</div>
		<div class="contains-oversized">
			<table id="table"></table>
		</div>
		<script>
			const inputs = document.getElementsByTagName("input");
			const calendars = document.getElementById("calendars");
			const columns = ["Series", "Episode", "Name", "Stardate", "Airdate", "Seen"];
			const colours = {
				all: ["#aceebb", "#116329"],
				tos: ["#fff2cc", "#fccb3c"],
				tas: ["#fce5cd", "#fa9b37"],
				mov: ["#aceebb", "#116329"],
				tng: ["#c9daf8", "#2e5fb6"],
				ds9: ["#d9d2e9", "#6032cb"],
				voy: ["#f4cccc", "#e53636"],
				ent: ["#d9ead3", "#429b22"],
				ff: ["#999999", "#151515"],
			};

			const futureEpisodes = d3
				.csv(
					"https://docs.google.com/spreadsheets/d/1NaLUipHe_Urd6mruBPDloQdYd38xll-BAJkcm4aSIYE/export?format=csv&gid=461958934"
				)
				.then((episodes) => {
					tabulate(episodes);
					return episodes;
				})
				.then((episodes) => episodes.filter((episode) => episode.Seen.match(/\d+-\d+-\d+/)));

			const tabulate = (episodes) => {
				const table = d3.select("table");
				const thead = table.append("thead");
				const tbody = table.append("tbody");

				// append the header row
				thead
					.append("tr")
					.selectAll("th")
					.data(columns)
					.enter()
					.append("th")
					.text((column) => column);

				// create a row for each object in the data
				const rows = tbody
					.selectAll("tr")
					.data(episodes)
					.enter()
					.append("tr")
					.attr("class", (episode) => episode.Series.toLowerCase());

				// create a cell in each row for each column
				rows.selectAll("td")
					.data((row) => columns.map((column) => ({column: column, value: row[column]})))
					.enter()
					.append("td")
					.text(({value}) => value);
			};

			const getRange = async () => {
				const episodes = await futureEpisodes;
				const years = episodes.reduce(
					(years, {Seen: seen}) => years.add(Number(seen.match(/\d\d\d\d/)[0])),
					new Set()
				);
				const firstYear = Math.min(...years);
				const lastYear = Math.max(...years);
				return {low: firstYear, high: lastYear};
			};

			const getEpisodes = async (filter) => {
				const episodes = await futureEpisodes;
				if (filter === "all") {
					return {episodes, unit: "show", colours: colours[filter]};
				} else if (filter === "mov") {
					const shows = new Set(Array.from(inputs).map((input) => input.id.toUpperCase()));
					return {
						episodes: episodes.filter((episode) => !shows.has(episode.Series)),
						unit: "movie",
						colours: colours[filter],
					};
				} else {
					const series = filter.toUpperCase();
					return {
						episodes: episodes.filter((episode) => episode.Series === series),
						unit: "episode",
						colours: colours[filter],
					};
				}
			};

			const setShowFilter = async (filter) => setEpisodes(await getEpisodes(filter));

			const setEpisodes = async ({episodes, unit, colours}) => {
				calendars.innerHTML = "";
				const range = await getRange();
				for (let year = range.low; year <= range.high; year++) {
					const label = document.createElement("span");
					label.innerText = String(year);
					const calendarElement = document.createElement("div");

					const cal = new CalHeatmap();
					cal.paint(
						{
							itemSelector: calendarElement,
							date: {
								start: new Date(`${year}-01-01`),
							},
							rowLimit: 7,
							range: 12,
							domain: {type: "month", gutter: 2},
							subDomain: {type: "ghDay"},
							data: {
								source: episodes,
								x: "Seen",
								groupY: "count",
							},
							scale: {
								color: {
									range: colours,
									interpolate: "hsl",
									type: "pow",
									domain: [1, 5],
								},
							},
						},
						[
							[
								Tooltip,
								{
									enabled: true,
									text: (timestamp, value) => {
										const episodes = value === 1 ? `1 ${unit}` : `${value ?? 0} ${unit}s`;
										const date = new Date(timestamp).toDateString();
										return `${episodes} on ${date}`;
									},
								},
							],
							[
								CalendarLabel,
								{
									position: "left",
									text: () => ["", "Mon", "", "Wed", "", "Fri", ""],
									textAlign: "end",
									width: 30,
									padding: [0, 5, 0, 0],
								},
							],
						]
					);

					calendars.append(label, calendarElement);
				}
			};

			for (const input of inputs) {
				input.addEventListener("click", () => setShowFilter(input.id));
			}
			setShowFilter("all");
		</script>
	</body>
</html>
